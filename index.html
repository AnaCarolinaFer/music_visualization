<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardim Musical</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variaveis.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/componentes/card-planta.css">
    <link rel="stylesheet" href="css/componentes/sidebar.css">
    <link rel="stylesheet" href="css/telas/home.css">
    <link rel="stylesheet" href="css/telas/explorar.css">
    <link rel="stylesheet" href="css/telas/laboratorio.css">
    <link rel="stylesheet" href="css/componentes/modal.css">
</head>
<body>

    <!-- Canvas WEBGL persistente (criado pelo p5.js em setup) -->
    <div id="canvas-container"></div>

    <!-- Camada de UI — substituída a cada troca de tela -->
    <div id="app"></div>

    <!-- ======================================================
         Templates das telas
         ====================================================== -->

    <template id="tpl-tela-inicial">
        <div id="tela-inicial">
            <button id="btn-professor" onclick="abrirModalProfessor()">
                <span class="avatar">👩🏽‍🏫</span>
                <span class="texto">
                    <span class="linha1" data-i18n="home.professor">Área do professor</span>
                    <span class="linha2" data-i18n="home.professorSub">Recursos e atividades</span>
                </span>
            </button>

            <div id="home-centro">
                <h1 data-i18n="home.titulo">JARDIM MUSICAL</h1>
                <p data-i18n="home.subtitulo">Veja a música florescer em um jardim cheio de vida!</p>
                <div id="home-cards">
                    <button class="card-modo explorar" onclick="entrarModoJardim()">
                        <span class="pictograma">🌳</span>
                        <span class="card-texto">
                            <span class="titulo" data-i18n="home.botaoJardim">Explorar o jardim</span>
                            <span class="sub" data-i18n="home.subJardim">Muitas plantas dançando com a sua música</span>
                        </span>
                    </button>
                    <button class="card-modo laboratorio" onclick="entrarModoEstudo()">
                        <span class="pictograma">🔍</span>
                        <span class="card-texto">
                            <span class="titulo" data-i18n="home.botaoEstudo">Laboratório das plantas</span>
                            <span class="sub" data-i18n="home.subEstudo">Estude cada plantinha de pertinho</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-modo-jardim">
        <!-- 3 Botões circulares (canto superior direito) -->
        <div id="botoes-circulares">
            <button class="btn-circular" style="background:var(--rosa-botao)" onclick="voltarMenu()" title="Início">🏠</button>
            <button class="btn-circular" style="background:var(--lilas)" onclick="abrirModalProfessor()" title="Professor">👩🏽‍🏫</button>
            <button class="btn-circular btn-menu" style="background:var(--verde-grama)" onclick="toggleSidebar()" title="Músicas &amp; Filtros">☰</button>
        </div>

        <!-- Barra inferior -->
        <div id="barra-inferior">
            <span id="nome-musica" data-i18n="explorar.instrucao">Envie uma música para começar</span>
            <div id="controles-centro">
                <button id="play-btn" onclick="togglePlay()"><svg width="14" height="14" viewBox="0 0 14 14" fill="white"><polygon points="3,2 12,7 3,12"/></svg></button>
            </div>
            <div id="volume-area">
                <label for="volume-slider">🔊</label>
                <input type="range" id="volume-slider" min="0" max="100" value="100"
                       oninput="ajustarVolume(this.value)">
            </div>
        </div>

        <!-- Input de arquivo (oculto — event delegation no setup()) -->
        <input type="file" id="audio-file" accept=".mp3,.wav,.ogg,.flac,.m4a" style="display:none">
        <!-- Status oculto — mantido para compatibilidade com audio.js / sketch.js -->
        <span id="status" style="display:none"></span>

        <!-- Sidebar direita com tabs -->
        <div id="sidebar-painel">
            <div class="sidebar-header">
                <div id="sidebar-tabs"></div>
                <button class="sidebar-fechar" onclick="fecharSidebar()">✕</button>
            </div>
            <div id="pane-biblioteca" class="tab-pane">
                <div id="secao-faixas-prontas" style="display:none">
                    <p class="sidebar-secao-titulo" data-i18n="explorar.faixasProntas">Faixas prontas</p>
                    <div id="lista-faixas-prontas"></div>
                </div>
                <p id="sidebar-sem-musicas" data-i18n="explorar.semMusicas">Nenhuma música salva ainda.</p>
                <div id="lista-musicas-conteudo"></div>
                <button id="btn-adicionar-musica" onclick="document.getElementById('audio-file').click()">
                    + <span data-i18n="explorar.adicionarMusica">Adicionar música</span>
                </button>
            </div>
            <div id="pane-filtros" class="tab-pane" style="display:none">
                <p class="filtros-desc" data-i18n="explorar.filtrosDesc">
                    Escolha quais partes da música você quer ouvir e ver as plantinhas dançarem!
                </p>
                <div id="filtros-lista"></div>
            </div>
        </div>

        <!-- Debug panel -->
        <div id="debug-panel">
            <div><strong>Amplitudes dos Stems</strong></div>
            <div class="stem-bar" id="graves-bar">
                <span class="label">Graves</span>
                <span class="bar-bg"><span class="bar-fill" style="width:0%"></span></span>
                <span class="value">0.00</span>
            </div>
            <div class="stem-bar" id="melodia-bar">
                <span class="label">Melodia</span>
                <span class="bar-bg"><span class="bar-fill" style="width:0%"></span></span>
                <span class="value">0.00</span>
            </div>
            <div class="stem-bar" id="percussao-bar">
                <span class="label">Percussão</span>
                <span class="bar-bg"><span class="bar-fill" style="width:0%"></span></span>
                <span class="value">0.00</span>
            </div>
            <div class="stem-bar" id="agudos-bar">
                <span class="label">Agudos</span>
                <span class="bar-bg"><span class="bar-fill" style="width:0%"></span></span>
                <span class="value">0.00</span>
            </div>
            <div id="fps">FPS: --</div>
            <div class="debug-hint" data-i18n="explorar.debugHint">D: debug | Espaço: play/pause</div>
        </div>
    </template>

    <template id="tpl-laboratorio">
        <div id="lab-overlay">
            <!-- 2 Botões circulares (canto superior direito) -->
            <div id="botoes-circulares">
                <button class="btn-circular" style="background:var(--rosa-botao)" onclick="voltarMenu()" title="Início">🏠</button>
                <button class="btn-circular" style="background:var(--lilas)" onclick="abrirModalProfessor()" title="Professor">👩🏽‍🏫</button>
            </div>

            <!-- Header -->
            <div id="lab-header">
                <span class="lab-icon">🔍</span>
                <h1 class="lab-titulo" data-i18n="estudo.titulo">Laboratório das plantas</h1>
            </div>

            <!-- Pills de espécie -->
            <div id="lab-pills">
                <button class="pill-especie" data-especie="arvore" onclick="selecionarEspecieEstudo('arvore')">
                    <span data-i18n="especies.arvore.nome">Árvore</span>
                </button>
                <button class="pill-especie" data-especie="flor" onclick="selecionarEspecieEstudo('flor')">
                    <span data-i18n="especies.flor.nome">Flor</span>
                </button>
                <button class="pill-especie" data-especie="arbusto" onclick="selecionarEspecieEstudo('arbusto')">
                    <span data-i18n="especies.arbusto.nome">Arbusto</span>
                </button>
                <button class="pill-especie" data-especie="dente" onclick="selecionarEspecieEstudo('dente')">
                    <span data-i18n="especies.dente.nome">Dente-de-leão</span>
                </button>
            </div>

            <!-- Layout principal: 2 colunas -->
            <div id="lab-main">
                <!-- Esquerda: palco + estímulos -->
                <div id="lab-col-esquerda">
                    <div id="lab-palco"></div>
                    <div id="estudo-notas"></div>
                </div>

                <!-- Direita: wrapper relativo para imagem transbordar -->
                <div id="lab-col-direita">
                    <div id="lab-painel">
                        <div id="estudo-tabela"></div>
                    </div>
                    <img id="lab-decoracao" src="assets/laboratorio-decoracao.png" alt=""
                         onerror="this.style.display='none'">
                </div>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
    <script src="js/textos.js"></script>
    <script src="js/componentes.js"></script>
    <script src="connected.js"></script>
    <script src="config.js"></script>
    <script src="sprites.js"></script>
    <script src="animacao.js"></script>
    <script src="cacheStems.js"></script>
    <script src="sintetizador.js"></script>
    <script src="modos.js"></script>
    <script src="audio.js"></script>
    <script src="particulas.js"></script>
    <script src="plantas.js"></script>
    <script src="sketch.js"></script>
</body>
</html>
